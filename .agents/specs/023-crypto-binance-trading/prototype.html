<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Spot Trading Application — Prototype (023-crypto-binance-trading)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --binance-yellow: #F0B90B;
      --binance-dark: #222126;
      --dark-card: #2B2F36;
      --crypto-green: #0ECB81;
      --crypto-red: #F6465D;
      --border-color: #383e4a;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background-color: var(--binance-dark);
      color: white;
      margin: 0; padding: 0;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      height: 56px; background: #1E2026; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center; padding: 0 24px;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; }
    .brand-yellow { color: var(--binance-yellow); }

    .btn-pill-yellow {
      background: var(--binance-yellow); color: #1E2026; border: none;
      padding: 10px 24px; border-radius: 50px; font-weight: 700; font-size: 13px; cursor: pointer;
    }

    /* Main Trading Grid */
    .workspace {
      flex: 1; display: grid; grid-template-columns: 260px 1fr 300px; gap: 1px; background: var(--border-color); overflow: hidden;
    }

    .panel { background: var(--binance-dark); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

    .ticker-header {
      background: var(--dark-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }

    .orderbook-row { display: flex; justify-content: space-between; font-size: 12px; font-family: var(--font-mono); margin-bottom: 4px; }
    .bid { color: var(--crypto-green); }
    .ask { color: var(--crypto-red); }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="brand">
      <span class="brand-yellow">❖ BINANCE</span>
      <span style="font-size: 14px; color: #848E9C;">Spot Trading Floor</span>
    </div>
    <button class="btn-pill-yellow" onclick="openOrderModal()">Deposit / Buy BTC</button>
  </header>

  <!-- Workspace Grid -->
  <div class="workspace">
    <!-- Left Panel: Markets -->
    <div class="panel">
      <h4 style="margin:0 0 10px 0; font-size:13px; color:#848E9C;">Spot Markets</h4>
      <div style="background:var(--dark-card); border-radius:6px; padding:10px; font-size:12px; display:flex; justify-content:space-between; margin-bottom:6px;">
        <strong>BTC/USDT</strong>
        <span class="bid">$64,250.00 (+3.45%)</span>
      </div>
      <div style="background:var(--dark-card); border-radius:6px; padding:10px; font-size:12px; display:flex; justify-content:space-between;">
        <span>ETH/USDT</span>
        <span class="bid">$3,480.20 (+2.10%)</span>
      </div>
    </div>

    <!-- Center Panel: Candlestick Chart -->
    <div class="panel">
      <div class="ticker-header">
        <div>
          <strong style="font-size:16px; color:var(--binance-yellow);">BTC/USDT Spot Market</strong>
          <span style="font-size:12px; color:#848E9C; margin-left:8px;">24h Vol: 42,810.50 BTC</span>
        </div>
        <span class="bid" style="font-size:18px; font-weight:700;">$64,250.00</span>
      </div>

      <div style="flex:1; background:#1E2026; border:1px solid var(--border-color); border-radius:12px; padding:20px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="font-size:12px; color:#848E9C;">BinancePlex Ticker Depth Chart</div>
        <svg width="100%" height="220" viewBox="0 0 600 220">
          <path d="M 0 180 L 60 140 L 120 160 L 180 90 L 240 120 L 300 50 L 360 80 L 420 30 L 480 60 L 540 20 L 600 40" stroke="#0ECB81" stroke-width="4" fill="none"/>
        </svg>
        <button class="btn-pill-yellow" style="width:100%; font-size:14px; padding:14px;" onclick="openOrderModal()">Instant Buy BTC with USDT</button>
      </div>
    </div>

    <!-- Right Panel: Orderbook Bids & Asks -->
    <div class="panel">
      <h4 style="margin:0 0 10px 0; font-size:13px; color:#848E9C;">Orderbook Depth</h4>
      <div class="orderbook-row ask"><span>64,258.00</span><span>0.824 BTC</span></div>
      <div class="orderbook-row ask"><span>64,255.00</span><span>1.420 BTC</span></div>
      <div class="orderbook-row ask"><span>64,252.50</span><span>0.105 BTC</span></div>
      <div style="border-top:1px solid var(--border-color); margin:8px 0;"></div>
      <div class="orderbook-row bid"><span>64,248.00</span><span>2.850 BTC</span></div>
      <div class="orderbook-row bid"><span>64,245.00</span><span>0.954 BTC</span></div>
    </div>
  </div>

  <script>
    function openOrderModal() {
      alert('✅ Binance Spot Order Execution: Bought 0.0146 BTC at $64,250.00!');
    }
  </script>

</body>
</html>
