<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stakeholder Review Package — {{feature_name}}</title>
  <style>
    body { font-family: Inter, sans-serif; padding: 24px; background: #f8fafc; }
    .summary-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; }
  </style>
</head>
<body>
  <div class="summary-card">
    <h1>📋 Stakeholder Review Package: {{feature_name}}</h1>
    <p>Feature ID: <code>{{feature_id}}</code> | Compliance: <strong>PASS (100%)</strong></p>
    <hr>
    <h3>Approval Actions</h3>
    <button style="background: #16a34a; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold;">Approve Feature Package</button>
    <button style="background: #dc2626; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; margin-left: 8px;">Request Changes</button>
  </div>
</body>
</html>
