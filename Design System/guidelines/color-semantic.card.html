<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="brand · positive · negative · warning · hyperlink" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:100%;padding:8px;box-sizing:border-box;font-family:var(--font-core);font-size:12px">
<div style="background:var(--color-alias-brand);border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#000">Brand</div>
<div style="background:var(--color-alias-positive);border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#fff">Positive</div>
<div style="background:var(--color-alias-negative);border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#fff">Negative</div>
<div style="background:var(--color-alias-warning);border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#fff">Warning</div>
<div style="background:var(--color-alias-hyperlink);border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#fff">Link</div>
</div>
